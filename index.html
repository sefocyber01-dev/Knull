<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knull</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial, sans-serif;
  background:black;
}

/* VIDEO TAM SIĞSIN */
#bg-video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:contain;   /* BURASI DEĞİŞTİ */
  background:black;     /* Kenarlarda siyah boşluk olur */
  z-index:0;
}

/* CARD ORTADA */
.card{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:90%;
  max-width:330px;
  background:rgba(0,0,0,0.45);
  border-radius:20px;
  padding:25px;
  text-align:center;
  color:white;
  z-index:2;
}

h1{
  font-family:'Creepster', cursive;
  font-size:50px;
  color:#ff0000;
  text-shadow:0 0 20px red;
  margin-bottom:20px;
}

.btn{
  display:block;
  margin:10px 0;
  padding:12px;
  border-radius:12px;
  background:linear-gradient(45deg,#ff0000,#000);
  text-decoration:none;
  color:white;
  font-weight:bold;
}

.player{
  margin-top:20px;
  background:#0b0b0b;
  padding:20px;
  border-radius:18px;
}

.disc{
  width:110px;
  height:110px;
  margin:0 auto 15px;
  border-radius:50%;
  background:url("https://i.ibb.co/RTF13BzR/Screenshot-2025-08-27-23-07-53-355-com-miui-mediaviewer.jpg") center/cover;
  box-shadow:0 0 35px red;
  cursor:pointer;
}

.spin{
  animation:spin 3s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0)}
  to{transform:rotate(360deg)}
}

.bar{
  height:4px;
  background:#333;
  border-radius:2px;
  overflow:hidden;
  margin:10px 0;
}

.progress{
  height:100%;
  width:0;
  background:white;
}

.time{
  font-size:12px;
  display:flex;
  justify-content:space-between;
  opacity:.8;
}

.controls{
  display:flex;
  justify-content:center;
  gap:30px;
  margin-top:15px;
}

.icon{
  width:28px;
  height:28px;
  cursor:pointer;
  fill:white;
}
</style>
</head>

<body>

<video id="bg-video" autoplay muted loop playsinline webkit-playsinline preload="auto">
  <source src="https://files.catbox.moe/2hebl8.mp4" type="video/mp4">
</video>

<div class="card">

<h1>KNULL</h1>

<a class="btn" href="https://t.me/KnullOPs1">Telegram</a>
<a class="btn" href="https://instagram.com/kyulls1">Instagram</a>
<a class="btn" href="https://tiktok.com/@knulls1">TikTok</a>
<a class="btn" href="https://wa.me/989120813913">WhatsApp</a>

<div class="player">
<div id="disc" class="disc"></div>

<div class="bar">
<div id="prog" class="progress"></div>
</div>

<div class="time">
<span id="cur">0:00</span>
<span id="dur">0:00</span>
</div>

<div class="controls">
<svg class="icon" viewBox="0 0 24 24">
<path d="M11 18V6l-8.5 6L11 18zm1-6l8.5 6V6L12 12z"/>
</svg>

<svg id="play" class="icon" viewBox="0 0 24 24">
<path d="M8 5v14l11-7z"/>
</svg>

<svg class="icon" viewBox="0 0 24 24">
<path d="M13 6v12l8.5-6L13 6zm-1 6L3.5 6v12L12 12z"/>
</svg>
</div>
</div>

</div>

<audio id="music" loop>
<source src="https://files.catbox.moe/fb52ne.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("music");
const playBtn = document.getElementById("play");
const disc = document.getElementById("disc");
const prog = document.getElementById("prog");
const cur = document.getElementById("cur");
const dur = document.getElementById("dur");

/* Süre formatı */
function formatTime(sec){
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ":" + (s < 10 ? "0" : "") + s;
}

/* Metadata */
music.addEventListener("loadedmetadata", () => {
  dur.textContent = formatTime(music.duration);
});

/* Progress */
music.addEventListener("timeupdate", () => {
  const percent = (music.currentTime / music.duration) * 100;
  prog.style.width = percent + "%";
  cur.textContent = formatTime(music.currentTime);
});

/* Play / Pause */
function toggleMusic(){
  if(music.paused){
    music.play().then(()=>{
      disc.classList.add("spin");
      playBtn.innerHTML = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
    }).catch(err=>{
      console.log("Play error:", err);
    });
  } else {
    music.pause();
    disc.classList.remove("spin");
    playBtn.innerHTML = '<path d="M8 5v14l11-7z"/>';
  }
}

playBtn.addEventListener("click", toggleMusic);
disc.addEventListener("click", toggleMusic);
</script>

</body>
  </html>
